<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>카카오 장소 지도</title>
    <!-- Vite가 카카오 JavaScript 키를 치환하는 독립 지도 페이지입니다. -->
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #e9ecea;
        font-family: Pretendard, "Noto Sans KR", sans-serif;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #475569;
        background: #f8faf9;
        font-size: 13px;
        font-weight: 700;
      }
      #status.hidden {
        display: none;
      }
      #controls {
        position: absolute;
        right: 12px;
        bottom: 18px;
        z-index: 5;
        display: grid;
        gap: 7px;
      }
      #controls button {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 12px;
        color: #1f2937;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 3px 12px rgba(15, 23, 42, 0.14);
        font-size: 20px;
        font-weight: 800;
      }
      #controls button:active {
        background: #e6f4f1;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <button id="zoom-in" type="button" aria-label="지도 확대">+</button>
      <button id="zoom-out" type="button" aria-label="지도 축소">−</button>
      <button id="recenter" type="button" aria-label="선택 장소로 이동">◎</button>
    </div>
    <div id="status">지도를 불러오는 중입니다.</div>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_JAVASCRIPT_KEY%&autoload=false"></script>
    <script>
      const statusElement = document.getElementById("status");
      const state = {
        map: null,
        markers: [],
        places: [],
        selectedId: null,
        viewportMode: "overview",
        lastViewportKey: null,
        currentLocation: null,
        currentMarker: null,
      };

      const postToHost = (message) => {
        window.parent.postMessage(message, "*");
        window.ReactNativeWebView?.postMessage(JSON.stringify(message));
      };

      const markerImage = (label, selected) => {
        const width = selected ? 32 : 24;
        const height = selected ? 39 : 30;
        const center = width / 2;
        const color = selected ? "#0F766E" : "#64748B";
        const fill = selected ? "#0F766E" : "#FFFFFF";
        const text = selected ? "#FFFFFF" : "#475569";
        const fontSize = selected ? 11 : 9;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><filter id="s" x="-35%" y="-25%" width="170%" height="180%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.2"/></filter><path filter="url(#s)" d="M${center} ${height - 2}C${center - 2} ${height - 8} 4 ${height - 14} 4 ${center}A${center - 4} ${center - 4} 0 1 1 ${width - 4} ${center}C${width - 4} ${height - 14} ${center + 2} ${height - 8} ${center} ${height - 2}Z" fill="${fill}" stroke="${color}" stroke-width="2"/><text x="${center}" y="${center}" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="${fontSize}" font-weight="800" fill="${text}">${label}</text></svg>`;
        return new kakao.maps.MarkerImage(
          `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`,
          new kakao.maps.Size(width, height),
          { offset: new kakao.maps.Point(center, height - 2) },
        );
      };

      const currentLocationImage = () => {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="4"/><circle cx="12" cy="12" r="11" fill="none" stroke="#2563EB" stroke-opacity="0.25" stroke-width="2"/></svg>`;
        return new kakao.maps.MarkerImage(
          `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`,
          new kakao.maps.Size(24, 24),
          { offset: new kakao.maps.Point(12, 12) },
        );
      };

      const renderPlaces = ({ fitViewport = true } = {}) => {
        if (!state.map) return;
        state.markers.forEach((marker) => marker.setMap(null));
        state.markers = [];
        if (state.currentMarker) state.currentMarker.setMap(null);
        state.currentMarker = null;
        const bounds = new kakao.maps.LatLngBounds();
        let boundsCount = 0;

        if (state.currentLocation) {
          const currentPosition = new kakao.maps.LatLng(
            state.currentLocation.lat,
            state.currentLocation.lng,
          );
          state.currentMarker = new kakao.maps.Marker({
            map: state.map,
            position: currentPosition,
            image: currentLocationImage(),
            title: "현재 위치",
            zIndex: 20,
          });
          if (state.viewportMode === "overview") {
            bounds.extend(currentPosition);
            boundsCount += 1;
          }
        }

        state.places.forEach((place) => {
          const position = new kakao.maps.LatLng(place.lat, place.lng);
          const selected = String(place.id) === String(state.selectedId);
          const marker = new kakao.maps.Marker({
            map: state.map,
            position,
            image: markerImage(place.label, selected),
            title: place.name,
            zIndex: selected ? 10 : 1,
          });
          kakao.maps.event.addListener(marker, "click", () => {
            postToHost({
              type: "life-infra-map:select-place",
              id: place.id,
            });
          });
          state.markers.push(marker);
          bounds.extend(position);
          boundsCount += 1;
        });

        if (!fitViewport) return;
        if (state.viewportMode === "selected" && state.places.length) {
          const selected = state.places.find(
            (place) => String(place.id) === String(state.selectedId),
          ) || state.places[0];
          state.map.setCenter(new kakao.maps.LatLng(selected.lat, selected.lng));
          state.map.setLevel(3);
        } else if (boundsCount > 1) state.map.setBounds(bounds, 48, 48, 48, 48);
        else if (state.places.length === 1) {
          state.map.setCenter(
            new kakao.maps.LatLng(state.places[0].lat, state.places[0].lng),
          );
          state.map.setLevel(4);
        } else if (state.currentLocation) {
          state.map.setCenter(
            new kakao.maps.LatLng(
              state.currentLocation.lat,
              state.currentLocation.lng,
            ),
          );
          state.map.setLevel(4);
        }
      };

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "life-infra-map:set-places") return;
        const nextViewportKey = String(event.data.viewportKey ?? "");
        const shouldFitViewport = state.lastViewportKey !== nextViewportKey;
        state.places = Array.isArray(event.data.places) ? event.data.places : [];
        state.selectedId = event.data.selectedId;
        state.viewportMode = event.data.viewportMode === "selected" ? "selected" : "overview";
        state.currentLocation =
          Number.isFinite(Number(event.data.currentLocation?.lat)) &&
          Number.isFinite(Number(event.data.currentLocation?.lng))
            ? {
                lat: Number(event.data.currentLocation.lat),
                lng: Number(event.data.currentLocation.lng),
              }
            : null;
        state.lastViewportKey = nextViewportKey;
        renderPlaces({ fitViewport: shouldFitViewport });
      });

      document.getElementById("zoom-in").addEventListener("click", () => {
        if (state.map) state.map.setLevel(Math.max(1, state.map.getLevel() - 1));
      });
      document.getElementById("zoom-out").addEventListener("click", () => {
        if (state.map) state.map.setLevel(Math.min(14, state.map.getLevel() + 1));
      });
      document.getElementById("recenter").addEventListener("click", () => {
        if (!state.map || (!state.places.length && !state.currentLocation)) return;
        const selected = state.places.find(
          (place) => String(place.id) === String(state.selectedId),
        ) || state.places[0] || state.currentLocation;
        state.map.panTo(new kakao.maps.LatLng(selected.lat, selected.lng));
      });

      if (!window.kakao?.maps?.load) {
        statusElement.textContent = "카카오 지도를 불러오지 못했습니다.";
      } else {
        kakao.maps.load(() => {
          state.map = new kakao.maps.Map(document.getElementById("map"), {
            center: new kakao.maps.LatLng(36.35, 127.8),
            level: 5,
          });
          kakao.maps.event.addListener(state.map, "idle", () => {
            const center = state.map.getCenter();
            postToHost({
              type: "life-infra-map:center-changed",
              lat: center.getLat(),
              lng: center.getLng(),
            });
          });
          statusElement.classList.add("hidden");
          renderPlaces();
          postToHost({ type: "life-infra-map:ready" });
        });
      }
    </script>
  </body>
</html>
