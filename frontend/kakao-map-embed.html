<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>카카오 장소 지도</title>
    <!-- Vite가 카카오 JavaScript 키를 치환하는 독립 지도 페이지입니다. -->
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #e9ecea;
        font-family: Pretendard, "Noto Sans KR", sans-serif;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #475569;
        background: #f8faf9;
        font-size: 13px;
        font-weight: 700;
      }
      #status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">지도를 불러오는 중입니다.</div>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_JAVASCRIPT_KEY%&autoload=false"></script>
    <script>
      const statusElement = document.getElementById("status");
      const state = { map: null, markers: [], places: [], selectedId: null };

      const postToHost = (message) => {
        window.parent.postMessage(message, "*");
        window.ReactNativeWebView?.postMessage(JSON.stringify(message));
      };

      const markerImage = (label, selected) => {
        const color = selected ? "#0F766E" : "#475569";
        const fill = selected ? "#0F766E" : "#FFFFFF";
        const text = selected ? "#FFFFFF" : "#1E293B";
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="42" height="50" viewBox="0 0 42 50"><filter id="s" x="-30%" y="-20%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.22"/></filter><path filter="url(#s)" d="M21 47C18 41 5 31 5 20A16 16 0 1 1 37 20C37 31 24 41 21 47Z" fill="${fill}" stroke="${color}" stroke-width="2.5"/><circle cx="21" cy="20" r="11" fill="${fill}"/><text x="21" y="20" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="${text}">${label}</text></svg>`;
        return new kakao.maps.MarkerImage(
          `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`,
          new kakao.maps.Size(42, 50),
          { offset: new kakao.maps.Point(21, 47) },
        );
      };

      const renderPlaces = () => {
        if (!state.map) return;
        state.markers.forEach((marker) => marker.setMap(null));
        state.markers = [];
        const bounds = new kakao.maps.LatLngBounds();

        state.places.forEach((place) => {
          const position = new kakao.maps.LatLng(place.lat, place.lng);
          const selected = String(place.id) === String(state.selectedId);
          const marker = new kakao.maps.Marker({
            map: state.map,
            position,
            image: markerImage(place.label, selected),
            title: place.name,
            zIndex: selected ? 10 : 1,
          });
          kakao.maps.event.addListener(marker, "click", () => {
            postToHost({
              type: "life-infra-map:select-place",
              id: place.id,
            });
          });
          state.markers.push(marker);
          bounds.extend(position);
        });

        if (state.places.length > 1) state.map.setBounds(bounds, 48, 48, 48, 48);
        else if (state.places.length === 1) {
          state.map.setCenter(
            new kakao.maps.LatLng(state.places[0].lat, state.places[0].lng),
          );
          state.map.setLevel(4);
        }
      };

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "life-infra-map:set-places") return;
        state.places = Array.isArray(event.data.places) ? event.data.places : [];
        state.selectedId = event.data.selectedId;
        renderPlaces();
      });

      if (!window.kakao?.maps?.load) {
        statusElement.textContent = "카카오 지도를 불러오지 못했습니다.";
      } else {
        kakao.maps.load(() => {
          state.map = new kakao.maps.Map(document.getElementById("map"), {
            center: new kakao.maps.LatLng(37.5665, 126.978),
            level: 5,
          });
          state.map.addControl(
            new kakao.maps.ZoomControl(),
            kakao.maps.ControlPosition.RIGHT,
          );
          statusElement.classList.add("hidden");
          renderPlaces();
          postToHost({ type: "life-infra-map:ready" });
        });
      }
    </script>
  </body>
</html>
