<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>장소 지도</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #e9ecea;
        font-family: Pretendard, "Noto Sans KR", sans-serif;
      }
      #status {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #475569;
        background: #f8faf9;
        font-size: 13px;
        font-weight: 700;
      }
      #status.hidden {
        display: none;
      }
      .place-marker {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border: 2px solid #475569;
        border-radius: 50% 50% 50% 0;
        color: #1e293b;
        background: #ffffff;
        box-shadow: 0 2px 5px rgb(15 23 42 / 24%);
        font: 800 12px/1 Arial, sans-serif;
        transform: rotate(-45deg);
      }
      .place-marker span {
        transform: rotate(45deg);
      }
      .place-marker.selected {
        border-color: #0f766e;
        color: #ffffff;
        background: #0f766e;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">지도를 불러오는 중입니다.</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const statusElement = document.getElementById("status");
      const state = { map: null, markerLayer: null, places: [], selectedId: null };

      const postToHost = (message) => {
        window.parent.postMessage(message, "*");
        window.ReactNativeWebView?.postMessage(JSON.stringify(message));
      };

      const markerIcon = (label, selected) =>
        L.divIcon({
          className: "",
          html: `<div class="place-marker${selected ? " selected" : ""}"><span>${label}</span></div>`,
          iconSize: [36, 42],
          iconAnchor: [18, 38],
        });

      const renderPlaces = () => {
        if (!state.map) return;
        state.markerLayer.clearLayers();
        const bounds = [];

        state.places.forEach((place) => {
          const selected = String(place.id) === String(state.selectedId);
          const position = [Number(place.lat), Number(place.lng)];
          const marker = L.marker(position, {
            icon: markerIcon(place.label, selected),
            title: place.name,
            zIndexOffset: selected ? 1000 : 0,
          }).addTo(state.markerLayer);
          marker.on("click", () => {
            postToHost({
              type: "life-infra-map:select-place",
              id: place.id,
            });
          });
          bounds.push(position);
        });

        if (state.places.length > 1)
          state.map.fitBounds(bounds, { padding: [48, 48], maxZoom: 16 });
        else if (state.places.length === 1) {
          state.map.setView(
            [Number(state.places[0].lat), Number(state.places[0].lng)],
            15,
          );
        }
      };

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "life-infra-map:set-places") return;
        state.places = Array.isArray(event.data.places) ? event.data.places : [];
        state.selectedId = event.data.selectedId;
        renderPlaces();
      });

      if (!window.L?.map) {
        statusElement.textContent = "지도를 불러오지 못했습니다.";
      } else {
        state.map = L.map("map", { zoomControl: true }).setView(
          [37.5665, 126.978],
          13,
        );
        state.markerLayer = L.layerGroup().addTo(state.map);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        })
          .on("load", () => statusElement.classList.add("hidden"))
          .on("tileerror", () => {
            statusElement.textContent = "지도 배경을 불러오지 못했습니다.";
          })
          .addTo(state.map);
        renderPlaces();
        postToHost({ type: "life-infra-map:ready" });
      }
    </script>
  </body>
</html>
