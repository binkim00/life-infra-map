# 로컬 개발용 인프라입니다.
# 앱(백엔드/프론트)은 아직 컨테이너로 띄우지 않고 호스트에서 그대로 실행합니다.
#
#   docker compose up -d          # 전체 시작
#   docker compose up -d db pgadmin   # DB + 관리 도구만 시작
#   docker compose down           # 중지 (데이터는 남음)
#   docker compose down -v        # 중지 + 데이터 삭제
#
# DB 를 브라우저에서 눈으로 보려면 pgAdmin 을 사용합니다.
#
#   http://localhost:5050
#
# 접속 방법과 문제 해결은 docs/02_data/pgadmin-guide.md 를 참고하세요.
#
# PostGIS 이미지를 쓰는 이유는 장소 검색이 반경/거리 질의를 하기 때문입니다.
# 반경 검색은 ST_DWithin + GiST 인덱스로 처리합니다. (Place.geog 생성 컬럼)

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: life-infra-map-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_infra_map}
      POSTGRES_USER: ${POSTGRES_USER:-life_infra_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-life_infra_map}
      # 한글 정렬/비교를 위해 UTF-8 로 초기화합니다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 호스트에 이미 5432 를 쓰는 게 있으면 .env 에서 POSTGRES_PORT 를 바꾸세요.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Django 가 붙기 전에 DB 준비가 끝났는지 확인하는 용도입니다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-life_infra_map} -d ${POSTGRES_DB:-life_infra_map}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # DB 를 브라우저에서 눈으로 보기 위한 관리 도구입니다. 개발 편의용이며 앱 동작과는 무관합니다.
  # 필요 없으면 `docker compose up -d db` 처럼 db 만 올리면 됩니다.
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: life-infra-map-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # 로컬 전용이라 로그인/마스터 패스워드 단계를 생략합니다. 외부에 노출하지 마세요.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # 접속 대상을 미리 등록해 둡니다. 최초 실행 때 한 번만 읽힙니다.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

  # 업로드 파일(오류 제보 사진, 게시글 이미지, 프로필)을 두는 S3 호환 저장소입니다.
  # 로컬 `media/` 에 두면 배포 시 컨테이너가 재시작될 때마다 파일이 날아갑니다.
  # 개발 단계에서 같은 방식을 쓰면 나중에 S3 로 바꿀 때 설정값만 바뀝니다.
  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: life-infra-map-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-life_infra_map}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-life_infra_map_secret}
    ports:
      - "${S3_PORT:-9000}:9000"       # API
      - "${S3_CONSOLE_PORT:-9001}:9001"  # 웹 콘솔
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 버킷을 만들고 공개 읽기로 열어 둡니다. 한 번 실행되고 종료됩니다.
  storage_init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: life-infra-map-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${S3_ACCESS_KEY:-life_infra_map} ${S3_SECRET_KEY:-life_infra_map_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-life-infra-map-media} &&
      mc anonymous set download local/${S3_BUCKET:-life-infra-map-media} &&
      echo '버킷 준비 완료'
      "
    restart: "no"

  tag_scheduler:
    profiles: ["tag-collection"]
    build:
      context: ./backend
    container_name: life-infra-map-tag-scheduler
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py run_tag_collection_scheduler

  tag_worker:
    profiles: ["tag-collection"]
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py process_place_tag_collection_jobs --watch

volumes:
  db_data:
  pgadmin_data:
  storage_data:
