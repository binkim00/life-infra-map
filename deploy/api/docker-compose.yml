name: life-infra-map-api

services:
  django_api:
    build:
      context: ../../backend
    container_name: life-infra-map-django-api
    restart: unless-stopped
    init: true
    env_file:
      - ../../backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_infra_map}
      POSTGRES_USER: ${POSTGRES_USER:-life_infra_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # The deterministic local planner keeps the API available when an
      # optional external model endpoint is down.
      AI_PROVIDER: ${API_AI_PROVIDER:-rule}
    networks:
      - runtime-db
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"
    command: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${API_WORKERS:-2}
      --threads ${API_THREADS:-2}
      --timeout ${API_TIMEOUT_SECONDS:-120}
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/recommendations/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  runtime-db:
    external: true
    name: life-infra-map-runtime-db_default
