server {
    listen 3000;
    server_name _;
    include /etc/nginx/gateway-locations.inc;
}

# Only Caddy forwards to this port. The private port above never trusts
# client-supplied forwarding headers, even when peers share a host bridge.
server {
    listen 3001;
    server_name _;
    set_real_ip_from ${TRUSTED_EDGE_IP};
    real_ip_header X-Forwarded-For;
    include /etc/nginx/gateway-locations.inc;
}
