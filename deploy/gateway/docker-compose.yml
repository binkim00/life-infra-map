name: life-infra-map-gateway

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
      args:
        VITE_KAKAO_JAVASCRIPT_KEY: ${VITE_KAKAO_JAVASCRIPT_KEY:?VITE_KAKAO_JAVASCRIPT_KEY must be set}
    container_name: life-infra-map-gateway
    restart: unless-stopped
    init: true
    environment:
      TRUSTED_EDGE_IP: ${TRUSTED_EDGE_IP:-127.0.0.1}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
      - "127.0.0.1:${PUBLIC_GATEWAY_PORT:-3001}:3001"
    networks:
      - runtime-db
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}

networks:
  runtime-db:
    external: true
    name: life-infra-map-runtime-db_default
