name: life-infra-map-spring-api

services:
  spring_api:
    build:
      context: ../../spring-api
    container_name: life-infra-map-spring-api
    restart: unless-stopped
    init: true
    env_file:
      - ../../backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-life_infra_map}
      POSTGRES_USER: ${POSTGRES_USER:-life_infra_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_PORT: 8081
      JAVA_TOOL_OPTIONS: ${SPRING_JAVA_TOOL_OPTIONS:--Xms128m -Xmx384m}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:9000}
      S3_BUCKET: ${S3_BUCKET:-life-infra-map-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://100.71.169.91:9000/life-infra-map-media}
      APP_CORS_ALLOWED_ORIGINS: ${SPRING_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8082,http://127.0.0.1:8082}
    networks:
      - runtime-db
    ports:
      - "${SPRING_BIND_IP:-127.0.0.1}:${SPRING_PORT:-8081}:8081"
    mem_limit: ${SPRING_MEMORY_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  runtime-db:
    external: true
    name: life-infra-map-runtime-db_default
