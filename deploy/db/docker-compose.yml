name: life-infra-map-runtime-db

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: life-infra-map-runtime-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_infra_map}
      POSTGRES_USER: ${POSTGRES_USER:-life_infra_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 기본값은 서버 내부에서만 접근합니다. 집 worker를 연결할 때는
      # POSTGRES_BIND_IP에 서버의 Tailscale IP를 넣습니다.
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - runtime_db_data:/var/lib/postgresql/data
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-life_infra_map} -d ${POSTGRES_DB:-life_infra_map}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  runtime_db_data:
