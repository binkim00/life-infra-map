name: life-infra-map-storage

services:
  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: life-infra-map-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    ports:
      - "${STORAGE_BIND_IP:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    networks:
      runtime-db:
        aliases:
          - storage
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage_init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: life-infra-map-storage-init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-life-infra-map-media}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
      mc mb --ignore-existing "local/$${S3_BUCKET}" &&
      mc anonymous set download "local/$${S3_BUCKET}"
      '
    networks:
      - runtime-db
    restart: "no"

volumes:
  storage-data:

networks:
  runtime-db:
    external: true
    name: life-infra-map-runtime-db_default
