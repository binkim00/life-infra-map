name: life-infra-map-public-edge

services:
  public-edge:
    image: caddy:2.11.4-alpine
    container_name: life-infra-map-public-edge
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
